# Render Blueprint. In the Render dashboard choose Blueprints, then point a new
# Blueprint Instance at this repository; every setting below is applied for you.
#
# Render's free instance type caps a service at 512 MB of memory and about a
# tenth of a CPU. Exceeding the memory ceiling produces no error anyone can
# see: the container is killed and visitors get a dead page. So the settings
# below come from measurement rather than from optimism.
#
# Peak resident memory, measured at the worst case of stereo audio at 48 kHz
# sustained over repeated requests:
#
#     idle, imports loaded                117 MB
#     15 s clips                          431 MB, settled
#     30 s clips, stereo throughout       500 MB, still climbing
#     30 s clips, folded to mono          411 MB first request
#     60 s clips                          520 MB, over the ceiling
#
# The 30 second limit is made to fit by MAX_PROCESSING_SAMPLES, which folds a
# clip to mono once it grows past the budget. That halves a stereo recording
# while keeping its full frequency range, which is the cheaper loss for noise
# reduction than trimming the top of the spectrum.
#
# The remaining risk is the slow upward drift seen under sustained load, which
# is the memory allocator retaining what each job frees rather than a leak.
# app/memory.py returns that memory to the operating system after every job,
# which works on Linux as Render runs, but could not be verified on the macOS
# machine this was developed on. If the service restarts under load, look for
# "Out of memory" in the Render logs and drop MAX_DURATION_SECONDS to 20.

services:
  - type: web
    name: noisereduce
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Upload limits. The frontend reads these from /api/config and shows them
      # on the drop target, so changing them here updates the interface too.
      - key: MAX_DURATION_SECONDS
        value: "30"
      - key: MAX_UPLOAD_BYTES
        value: "10485760"

      # Total samples, counted across channels, that one clip may carry into
      # processing. 1.6 million is 30 seconds of mono at 48 kHz, so a stereo
      # clip at the duration limit is folded to mono and everything shorter is
      # left alone.
      - key: MAX_PROCESSING_SAMPLES
        value: "1600000"

      # Clip retention. Two folded clips fit here, so two visitors can work at
      # the same time without evicting each other.
      - key: CLIP_TTL_SECONDS
        value: "600"
      - key: MAX_CLIPS
        value: "2"
      - key: MAX_STORE_BYTES
        value: "26214400"
      - key: MAX_RENDERS_PER_CLIP
        value: "2"

      # One job at a time. Two concurrent clips would roughly double peak
      # memory and take the instance past its ceiling.
      - key: DSP_WORKERS
        value: "1"

      # Generous, because a tenth of a CPU makes each job several times slower
      # than it is on a development machine.
      - key: PROCESSING_TIMEOUT_SECONDS
        value: "45"

      # Rate limits apply per client address, and everyone behind one network
      # shares an address, so the budget is set for a room rather than a person.
      - key: UPLOAD_RATE
        value: "40"
      - key: UPLOAD_WINDOW_SECONDS
        value: "300"
      - key: PROCESS_RATE
        value: "400"
      - key: PROCESS_WINDOW_SECONDS
        value: "60"
