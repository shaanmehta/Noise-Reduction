# Fly.io deployment. Rename `app` to something unique before the first deploy.
app = "noisereduce"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  # Same-origin deployment: the container serves both the API and the frontend,
  # so no cross-origin entry is needed.
  ALLOWED_ORIGINS = "https://noisereduce.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true

  # Decoded clips live in this machine's memory. Scaling past one machine would
  # hand a visitor a clip id that the next machine has never heard of, so the
  # count is pinned at one. Raise it only behind sticky sessions.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 16
    hard_limit = 24

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  # Processing is quick; memory is the constraint, because clips are held in
  # RAM. 1 GB matches the 512 MB store ceiling in app/config.py plus overhead.
  memory = "1gb"
